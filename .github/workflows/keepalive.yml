name: Supabase keep-alive

# El plan gratuito de Supabase pausa los proyectos tras aproximadamente una semana sin actividad.
# Esta consulta de solo lectura, cada 3 días, evita la pausa. No modifica datos.
# Requiere dos secretos del repositorio (Settings > Secrets and variables > Actions):
#   SUPABASE_URL       URL del proyecto (https://xxxx.supabase.co)
#   SUPABASE_ANON_KEY  clave publicable (sb_publishable_...). NUNCA la service_role / sb_secret_.
on:
  schedule:
    - cron: '17 12 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Consulta de solo lectura a la API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Faltan los secretos SUPABASE_URL y/o SUPABASE_ANON_KEY."
            exit 1
          fi
          status=$(curl -sS --retry 3 --retry-delay 5 -o /dev/null -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/activities?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Respuesta de la API: $status"
          if [ "$status" != "200" ]; then
            echo "::error::La API respondió $status (se esperaba 200). ¿Proyecto pausado o claves incorrectas?"
            exit 1
          fi
